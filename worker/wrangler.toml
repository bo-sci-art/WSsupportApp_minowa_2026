name = "minowa-submit"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# CORS を許可するオリジン（カンマ区切り）。localhost / 127.0.0.1 は常に許可
ALLOWED_ORIGINS = "https://bo-sci-art.github.io"
# 作品の登録（POST /submit）を受け付けるか。"false" で止める。箕輪小はこれから授業があるので "true"。
# 授業が終わったら "false" にしてデプロイし、workshop/common/config.js の REGISTRATION_OPEN も false にする
REGISTRATION_OPEN = "true"

[[d1_databases]]
binding = "DB"
database_name = "minowa-artworks"
# ↓ 手順書の「2. D1 を作る」で表示された database_id に書きかえる
database_id = "c1f869c4-8666-412c-a887-d87bed17460e"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "minowa-artworks"
